<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widyastuti | PLPP</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #fff0f6;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: start;
      padding: 40px 10px;
    }

    .card {
      background-color: #fdfdfd;
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #b58c85;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
    }

    h2 {
      color: #5a3222;
      margin: 10px 0 5px;
    }

    p {
      color: #5a3222;
      margin: 0;
      font-size: 14px;
    }

    .divider {
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: #cbbab0;
      margin: 0 10px;
    }

    .divider span {
      color: #5a3222;
      font-size: 18px;
    }

    .menu-button {
      background-color: #f8d4dd;
      border: none;
      border-radius: 12px;
      padding: 15px;
      margin: 10px 0;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #880e4f;
      width: 100%;
      transition: background 0.3s ease;
    }

    .menu-button:hover {
      background-color: #f2b6c6;
    }

    .menu-subtext {
      font-size: 12px;
      font-weight: normal;
      margin-top: 4px;
      color: #880e4f;
    }

    .wa-button {
      margin-top: 20px;
      background-color: #25D366;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .wa-icon {
      font-size: 20px;
    }

    /* Submenu box styling */
    .submenu-box {
      background-color: #fff0f6;
      border: 2px solid #f48fb1;
      border-radius: 20px;
      padding: 20px 10px;
      margin-top: 10px;
      text-align: center;
      color: #d81b60;
      box-shadow: 0 4px 10px rgba(248, 187, 208, 0.2);
      animation: fadeIn 0.4s ease;
    }

    .submenu-box h3 {
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #d81b60;
    }

    .submenu-item {
      margin: 8px 0;
      font-size: 15px;
    }

    .submenu-item a {
      color: #d81b60;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .submenu-item a:hover {
      color: #ad1457;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media screen and (max-width: 480px) {
      .card {
        width: 90%;
        padding: 25px 15px;
      }

      .submenu-box {
        padding: 15px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="avatar">👩‍🔬</div>
    <h2>Widyastuti R</h2>
    <p>Fungsional PLPL Ahli Muda<br>Laboratorium SMK SMTI Makassar</p>

    <div class="divider"><span>♥</span></div>

    <!-- MSDS -->
    <button class="menu-button" onclick="toggleMenu('msds')">MSDS
      <div class="menu-subtext">Material Safety Data Sheet</div>
    </button>
    <div class="submenu-box" id="submenu-msds" style="display:none;">
      <h3>MSDS</h3>
      <div class="submenu-item"><a href="https://drive.google.com/drive/folders/1UI7BnpuOCG4pnhs61zuFXsh1h8hyyOdh" target="_blank">MSDS Lab. DKL</a></div>
      <div class="submenu-item"><a href="https://drive.google.com/drive/folders/1Y8JaUoOCuPdBQhQADekvtMqxknbQyHm6" target="_blank">MSDS Lab. QC</a></div>
      <div class="submenu-item"><a href="https://drive.google.com/drive/folders/1KjScOJVv3HTq9ioeavOEjQ_3LufSZVdG" target="_blank">MSDS Lab. Mikro</a></div>
    </div>

    <!-- Stock Opname -->
    <button class="menu-button" onclick="toggleMenu('stock')">STOCK OPNAME
      <div class="menu-subtext">Bahan Kimia</div>
    </button>
    <div class="submenu-box" id="submenu-stock" style="display:none;">
      <h3>Stock Opname</h3>
      <div class="submenu-item"><a href="#" target="_blank">Stock Lab. DKL</a></div>
      <div class="submenu-item"><a href="#" target="_blank">Stock Lab. QC</a></div>
      <div class="submenu-item"><a href="#" target="_blank">Stock Lab. Mikro</a></div>
    </div>

    <!-- Form Penggunaan -->
    <button class="menu-button" onclick="toggleMenu('form')">FORM PENGGUNAAN
      <div class="menu-subtext">Alat Kimia</div>
    </button>
    <div class="submenu-box" id="submenu-form" style="display:none;">
      <h3>Form Penggunaan</h3>
      <div class="submenu-item"><a href="#" target="_blank">Form Item 1</a></div>
      <div class="submenu-item"><a href="#" target="_blank">Form Item 2</a></div>
      <div class="submenu-item"><a href="#" target="_blank">Form Item 3</a></div>
      <div class="submenu-item"><a href="#" target="_blank">Form Item 4</a></div>
      <div class="submenu-item"><a href="#" target="_blank">Form Item 5</a></div>
    </div>

    <!-- WhatsApp -->
    <a class="wa-button" href="https://wa.me/6281234567890" target="_blank">
      <span class="wa-icon">.</span>
      CONTACT ME
    </a>
  </div>

  <script>
    function toggleMenu(id) {
      const allMenus = ['msds', 'stock', 'form'];
      allMenus.forEach(menu => {
        const box = document.getElementById('submenu-' + menu);
        box.style.display = (menu === id && box.style.display === 'none') ? 'block' : 'none';
      });
    }
  </script>

</body>

</html>
